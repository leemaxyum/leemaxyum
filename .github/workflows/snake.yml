name: Contribution signal
on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-generated-assets
  cancel-in-progress: false
jobs:
  snake:
    if: github.repository == 'leemaxyum/leemaxyum'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: leemaxyum
          outputs: |
            output/github-snake-dark.svg?color_snake=#ffffff&color_dots=#111111,#444444,#777777,#aaaaaa,#dddddd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit contribution snake
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/github-snake-dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh contribution signal'
          git pull --rebase
          git push
