name: Coding Telemetry

on:
  schedule:
    - cron: "37 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  waka-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@370590ad8da8f54282ed92aa42b7c25ecbd5a9a6
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
